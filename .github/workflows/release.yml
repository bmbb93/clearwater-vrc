# Release and VPM listing.
#
# Push a tag "v<version>" (matching package.json) to build the package zip and publish it as a GitHub release,
# its notes the version's sections of CHANGELOG.md and CHANGELOG.en.md (both there, dated, not "Unreleased");
# the VPM listing (index.json on GitHub Pages, for ALCOM / VCC "Add repository") is then rebuilt from every
# release. "Run workflow" (manual) rebuilds only the listing.
#
# (One workflow for both: a release made with the workflow's own token does not start other workflows.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against package.json
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "ZIP=$name-$version.zip" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md and CHANGELOG.en.md
        run: |
          version=$(jq -r .version package.json)
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          # each file's section for the version: from its "## [x.y.z] - date" heading to the next heading or the link
          # references; the Japanese one, then the English one under a rule
          for f in CHANGELOG.md CHANGELOG.en.md; do
            heading=$(awk -v p="## [$version]" 'index($0, p) == 1 { print; exit }' "$f")
            if [ -z "$heading" ]; then
              echo "::error::$f has no section for $version"
              exit 1
            fi
            if echo "$heading" | grep -qi "unreleased"; then
              echo "::error::$f still has $version as Unreleased: give it the release date"
              exit 1
            fi
            section=$(awk -v h="$heading" '$0 == h { on = 1; next } on && (/^## \[/ || /^\[[^]]+\]: /) { exit } on' "$f")
            if ! grep -q "[^[:space:]]" <<<"$section"; then
              echo "::error::$f's section for $version is empty"
              exit 1
            fi
            [ -s "$notes" ] && printf '\n---\n' >> "$notes"
            printf '%s\n' "$section" >> "$notes"
          done
          echo "NOTES=$notes" >> "$GITHUB_ENV"

      - name: Zip the package
        run: |
          set -o pipefail
          # the package root is the repository root: its tracked files, less the repository's own. (git archive, not
          # zip: zip left no file here and the step still passed, the listing check being the last of a pipe)
          git archive --format=zip -o "$RUNNER_TEMP/$ZIP" HEAD -- . ':(exclude).github' ':(exclude).gitignore' ':(exclude).gitattributes'
          # LICENSE's .meta is not in the repository (GitHub took it for a second license on the repository page) but
          # Unity wants it in an installed package: written in here, with the GUID it has always had
          python3 - "$RUNNER_TEMP/$ZIP" <<'PY'
          import sys, zipfile
          meta = ("fileFormatVersion: 2\nguid: 89fca98d7fbf1dd4b9d898b4fb7e58e8\nDefaultImporter:\n"
                  "  externalObjects: {}\n  userData: \n  assetBundleName: \n  assetBundleVariant: \n")
          with zipfile.ZipFile(sys.argv[1], "a", zipfile.ZIP_DEFLATED) as z:
              z.writestr("LICENSE.meta", meta)
          PY
          test -s "$RUNNER_TEMP/$ZIP"
          unzip -l "$RUNNER_TEMP/$ZIP" | grep -q " LICENSE.meta$"
          unzip -l "$RUNNER_TEMP/$ZIP" | tail -1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (a release already there - the same tag pushed again - gets its files and notes replaced)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$ZIP" package.json --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/$ZIP" package.json \
              --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
          fi

  listing:
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the listing from every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/build-listing.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
